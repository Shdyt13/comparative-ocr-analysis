version: '3.8'

services:
  backend:
    build: ./backend
    container_name: ocr_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: ocr_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules    # Mencegah folder instalasi Node tertimpa folder lokal
    environment:
      - CHOKIDAR_USEPOLLING=true